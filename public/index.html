    <h1>Respan MCP Server</h1>
    <p class="subtitle">Redirecting to documentation...</p>
    <p>If you are not redirected automatically, <a href="https://www.respan.ai/docs/documentation/features/mcp/platform-mcp">click here</a>.</p>
    
    <noscript>
    <p class="subtitle">Model Context Protocol server for accessing Respan data from your AI assistant</p>
    
    <h2>Features</h2>
    <ul>
        <li><strong>Logs</strong> - Query and filter LLM request logs with powerful filtering</li>
        <li><strong>Traces</strong> - View complete execution traces with span trees</li>
        <li><strong>Customers</strong> - Access customer data and budget information</li>
        <li><strong>Prompts</strong> - Manage prompt templates and versions</li>
    </ul>

    <h2>Quick Start</h2>
    
    <div class="card">
        <h3>Mode 1: HTTP Streaming - Public Service</h3>
        <p>Use the hosted endpoint where each user provides their own API key:</p>
        <pre><code>{
  "mcpServers": {
    "respan": {
      "url": "https://mcp.respan.ai/api/mcp",
      "headers": {
        "Authorization": "Bearer YOUR_RESPAN_API_KEY"
      }
    }
  }
}</code></pre>
    </div>

    <div class="card">
        <h3>Mode 2: Local Stdio (Personal Use)</h3>
        <p>Run locally for development - simplest setup:</p>
        <pre><code>git clone https://github.com/respanai/respan-mcp.git
cd respan-mcp
npm install && npm run build</code></pre>
        <p>Configure your MCP client (<code>~/.cursor/mcp.json</code>):</p>
        <pre><code>{
  "mcpServers": {
    "respan": {
      "command": "node",
      "args": ["/path/to/respan-mcp/dist/lib/index.js"],
      "env": {
        "RESPAN_API_KEY": "your_api_key"
      }
    }
  }
}</code></pre>
    </div>

    <div class="card">
        <h3>Mode 3: HTTP Streaming - Private Deployment</h3>
        <p>Deploy to Vercel with API key stored as environment variable. No client-side key needed:</p>
        <ol>
            <li>Clone: <code>git clone <a href="https://github.com/respanai/respan-mcp">https://github.com/respanai/respan-mcp</a></code></li>
            <li>Deploy: <code>vercel deploy --prod</code></li>
            <li>Set <code>RESPAN_API_KEY</code> in Vercel Dashboard → Environment Variables</li>
        </ol>
        <p>Configure your MCP client:</p>
        <pre><code>{
  "mcpServers": {
    "respan": {
      "url": "https://your-project.vercel.app/mcp"
    }
  }
}</code></pre>
    </div>

    <h2>Available Tools</h2>
    <p>Everyday tools are listed at connect; <code>tool_search</code> finds the rest by resource and action words and <code>tool_run</code> runs them.</p>
    <table>
        <tr>
            <th>Area</th>
            <th>Tools</th>
        </tr>
        <tr>
            <td>Listed at connect</td>
            <td><code>log_list</code>, <code>log_get</code>, <code>log_summary</code>, <code>trace_list</code>, <code>trace_get</code>, <code>metric_summary</code>, <code>metric_timeseries</code>, <code>error_group_list</code>, <code>behavior_summary</code>, <code>prompt_list</code>, <code>tool_search</code>, <code>tool_run</code></td>
        </tr>
        <tr>
            <td>Found with tool_search</td>
            <td>traces, threads and usage rankings; behaviors and guardrails; errors and incidents; prompts and schemas; monitors and notification methods; datasets, experiments, graders and evaluators; automations and reports; caches, exports, webhooks, tags, saved views and dashboards; API keys, limits, credits, members and projects; provider keys (BYOK) and custom models; workspaces, billing and join requests</td>
        </tr>
    </table>

    <h2>Filter Examples</h2>
    <p>All list tools support powerful filtering:</p>
    <pre><code>{
  "cost": {"operator": "gt", "value": [0.01]},
  "model": {"operator": "", "value": ["gpt-4"]},
  "customer_identifier": {"operator": "contains", "value": ["user"]},
  "metadata__session_id": {"operator": "", "value": ["abc123"]}
}</code></pre>
    <p>Operators: <code>""</code> (equal), <code>not</code>, <code>lt</code>, <code>lte</code>, <code>gt</code>, <code>gte</code>, <code>contains</code>, <code>icontains</code>, <code>startswith</code>, <code>endswith</code>, <code>in</code>, <code>isnull</code></p>
